<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      :root {
        --bg: #f3f6ff;
        --panel: rgba(255, 255, 255, 0.9);
        --text: #1e2432;
        --muted: #5f6b85;
        --line: #dfe8ff;
        --primary: #4f46e5;
        --primary-strong: #4338ca;
        --primary-soft: #eef2ff;
        --success: #0f9f6e;
        --shadow: 0 18px 40px rgba(79, 70, 229, 0.12);
      }

      * { box-sizing: border-box; }

      body {
        width: 330px;
        margin: 0;
        padding: 16px;
        background: linear-gradient(180deg, #eef3ff 0%, #f8fbff 100%);
        color: var(--text);
        font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
      }

      .card {
        background: var(--panel);
        border: 1px solid rgba(146, 160, 224, 0.35);
        border-radius: 18px;
        padding: 14px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 800;
        font-size: 15px;
        letter-spacing: 0.02em;
      }

      .logo {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid rgba(79, 70, 229, 0.12);
        box-shadow: 0 8px 18px rgba(79, 70, 229, 0.18);
      }

      #plan {
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        background: #f3f4f6;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 8px;
      }

      .actions {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 9px 12px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      button:active { transform: translateY(0); }

      #upgrade, #save {
        background: linear-gradient(135deg, var(--primary), var(--primary-strong));
        color: #fff;
        box-shadow: 0 8px 18px rgba(79, 70, 229, 0.2);
      }

      #upgrade {
        flex: 1;
      }

      #manage {
        background: var(--primary-soft);
        color: #2d3a57;
        border: 1px solid #dfe7ff;
      }

      #save {
        min-width: 74px;
      }

      hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 12px 0;
      }

      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
        font-weight: 600;
      }

      input[type="text"], input[id="orgCode"] {
        width: 100%;
        margin-top: 6px;
        padding: 9px 10px;
        border: 1px solid #d6dffb;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.75);
        color: var(--text);
        font: inherit;
        transition: border-color 0.12s ease, box-shadow 0.12s ease;
      }

      input[type="text"]:focus, input[id="orgCode"]:focus {
        outline: none;
        border-color: #90a8ff;
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.08);
      }

      .checkbox-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin: 12px 0 8px;
        color: var(--text);
        font-size: 12px;
        line-height: 1.4;
      }

      input[type="checkbox"] {
        margin-top: 3px;
        accent-color: var(--primary);
        width: 14px;
        height: 14px;
      }

      .meta {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.5;
      }

      .footer {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      #ok {
        color: var(--success);
        font-size: 12px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <div class="brand">
          <img class="logo" src="pfp.png" alt="WingCO logo">
          <span>WingCO</span>
        </div>
        <span id="plan"></span>
      </div>

      <div class="actions">
        <button id="upgrade">Upgrade to Pro</button>
        <button id="manage" style="display:none">Manage billing</button>
      </div>

      <hr>

      <label>Company code (optional)
        <input id="orgCode" type="text" placeholder="ABC123">
      </label>

      <label class="checkbox-row">
        <input type="checkbox" id="shareTrends">
        <span>Share anonymous trend stats with my company</span>
      </label>

      <p class="meta">Only topic, intensity and time are shared, counted with others. Your text and identity are never shared. Switch off anytime.</p>

      <div class="footer">
        <button id="save">Save</button>
        <span id="ok"></span>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
